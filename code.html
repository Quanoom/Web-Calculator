<!doctype html>
<html lang="en">
    <head>
        <title>
            Calculator
        </title>
        <link rel="icon" type="image/x-icon" href="calculator.png">
        <link rel="stylesheet" href="code.css">
        <script src="script.js"></script>
    </head>
    <body>
        <h1>
            SIMPLE CALCULATOR
        </h1>
        <p class="text">Basic Operations</p>
        <div class="parent">
            <div class="box">
                <p class="result_1" id="display"></p>
                <p class="input" id="enter"></p>
            </div>
            <button onclick="fun_7()">7</button>
            <button onclick="fun_8()">8</button>
            <button onclick="fun_9()">9</button>
            <button class="operation" onclick="fun_add()">+</button>
            <button onclick="fun_4()">4</button>
            <button onclick="fun_5()">5</button>
            <button onclick="fun_6()">6</button>
            <button class="operation" onclick="fun_sub()">-</button>
            <button onclick="fun_1()">1</button>
            <button onclick="fun_2()">2</button>
            <button onclick="fun_3()">3</button>
            <button class="operation" onclick="fun_multi()">*</button>
            <button onclick="fun_0()">0</button>
            <button class="operation" onclick="fun_div()">/</button>
            <button class="operation"
            onclick="calculate()">=</button>
            <button onclick="clear_1()">
                Clear
            </button>
        </div>
        <pre>
            DESIGNER : DALI Fethi Abdellatif.
            10-26-2026.
            Basic Calculator.
        </pre>
    </body>
</html>
